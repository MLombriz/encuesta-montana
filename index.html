<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Encuesta sobre salidas de montaña (Tesis UTDT)</title>
<style>
  /* =======================================================================
     Encuesta del CP3 — tesis MiM + AI (UTDT), Martín Laborda.

     Regla de diseño que manda sobre todo lo demás: la mayoría va a responder
     desde el teléfono, y CADA PANTALLA TIENE QUE ENTRAR SIN SCROLL, con la
     comparación de los tres planes completa a la vista. Si hay que elegir
     entre que algo entre y que se vea todo, entra con scroll: nada se oculta.

     Decisiones que vienen de eso:
     · La página no scrollea por capricho: el encabezado de progreso queda
       pegado arriba, la barra de acción queda pegada abajo, y el contenido
       del medio está dimensionado para caber en 390x844 (iPhone chico).
     · Los niveles de los atributos se muestran con una etiqueta corta fiel,
       no con la frase larga del diseño. La frase completa queda en el atributo
       `title` de cada celda y el significado de cada atributo se explica en
       una pantalla previa. Sin esto la comparación no entra en un teléfono.
     · Las preguntas largas se reparten en más pantallas con menos ítems. En
       móvil eso baja el abandono: es peor una pantalla que se scrollea tres
       veces que dos pantallas cortas.
     · Nada de hover como único indicador: en teléfono no existe.
     ======================================================================= */
  /* Paleta: papel cálido, tinta fría. Es una encuesta académica que llega por
     un link de alguien: tiene que leerse como un cuestionario impreso y no como
     un embudo de venta. Un solo acento, usado para la acción y la selección,
     nunca para decorar.

     🔴 Los valores van primero en hexadecimal y después en OKLCH dentro de un
     @supports. Un teléfono Android con Chrome viejo (que en Argentina son
     muchos) no entiende oklch(), y como estos valores viven en variables, la
     variable queda inválida al usarse y el elemento se queda SIN color: la
     encuesta se serviría ilegible y nadie me lo iba a avisar, simplemente
     cerrarían la pestaña. */
  :root{
    --papel:        #fdfcfa;
    --fondo:        #f7f5f1;
    --fondo2:       #efece6;
    --tinta:        #22242b;
    --suave:        #6b6e78;
    --tenue:        #90939c;
    --linea:        #ddd9d1;
    --linea2:       #eceae4;
    --acento:       #2f4a72;
    --acento-hover: #253a5a;
    --acento-piso:  #eef1f8;
    --acento-linea: #9eaec8;
    --alerta:       #8a4a26;
    --alerta-piso:  #fbf2e9;
    --alerta-linea: #e4cbb2;
    --r: 12px;
    --r-chico: 9px;
    color-scheme: light;
  }
  @supports (color: oklch(50% 0.1 250)){
    :root{
      --papel:        oklch(99%   0.004  85);
      --fondo:        oklch(96.5% 0.007  85);
      --fondo2:       oklch(94%   0.008  85);
      --tinta:        oklch(24%   0.012 265);
      --suave:        oklch(49%   0.011 265);
      --tenue:        oklch(62%   0.010 265);
      --linea:        oklch(87.5% 0.009  85);
      --linea2:       oklch(93%   0.007  85);
      --acento:       oklch(43%   0.085 258);
      --acento-hover: oklch(37%   0.090 258);
      --acento-piso:  oklch(95.5% 0.022 258);
      --acento-linea: oklch(70%   0.060 258);
      --alerta:       oklch(45%   0.105  48);
      --alerta-piso:  oklch(96%   0.025  70);
      --alerta-linea: oklch(86%   0.040  70);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--fondo);color:var(--tinta);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* El armazón: barra de progreso arriba, lienzo que crece, barra de acción
     abajo. `min-height` y no `height` fija: con el teclado abierto o con el
     tamaño de letra del sistema en grande, una altura fija recorta contenido. */
  .app{min-height:100dvh;display:flex;flex-direction:column}
  @supports not (height: 100dvh){ .app{min-height:100vh} }
  .centro{width:100%;max-width:880px;margin:0 auto;padding:0 16px}

  /* ---------------------------------------------------------- progreso */
  /* Fondo opaco, no translúcido: pegado arriba tiene que tapar lo que pasa por
     abajo en el teléfono más lento que exista. */
  .top{position:sticky;top:0;z-index:20;background:var(--fondo);
    border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0)}
  .top .centro{padding-top:6px;padding-bottom:5px}
  .barra{height:4px;background:var(--fondo2);border-radius:2px;overflow:hidden}
  .barra > i{display:block;height:100%;background:var(--acento);width:0;
    transition:width .3s cubic-bezier(.22,1,.36,1)}
  .top-txt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    margin-top:5px;font-size:.73rem;color:var(--suave)}
  .top-txt b{font-weight:600;color:var(--tinta)}
  .salida{color:var(--tenue);text-decoration:underline;white-space:nowrap;font-size:.74rem}

  /* ------------------------------------------------------------ lienzo */
  .lienzo{flex:1 1 auto;padding:10px 0 12px}
  .lienzo .centro{display:flex;flex-direction:column;gap:9px}

  /* ------------------------------------------------- barra de acción */
  /* Pegada abajo siempre: en teléfono el botón que sigue tiene que estar a la
     vista sin buscarlo, y el aviso de error tiene que aparecer al lado del
     botón que la persona acaba de apretar, no arriba fuera de pantalla. */
  .pie{position:sticky;bottom:0;z-index:20;background:var(--papel);
    border-top:1px solid var(--linea);box-shadow:0 -6px 20px -16px rgba(34,36,43,.5);
    padding-bottom:env(safe-area-inset-bottom,0)}
  .pie .centro{padding-top:8px;padding-bottom:8px;display:flex;flex-direction:column;gap:7px}
  .acciones{display:flex;gap:10px;align-items:center}
  .acciones .pri{flex:1 1 auto}
  @media(min-width:560px){
    .acciones{justify-content:space-between}
    .acciones .pri{flex:0 0 auto;min-width:230px}
  }
  .acciones .sec{flex:0 0 auto}

  /* ------------------------------------------------------- tipografía */
  h1{font-size:1.34rem;line-height:1.22;margin:0;font-weight:680;letter-spacing:-.01em}
  h2{font-size:1.2rem;line-height:1.25;margin:0;font-weight:660;letter-spacing:-.005em}
  p{margin:0}
  .intro{color:var(--suave);font-size:.95rem;max-width:62ch}
  .micro{font-size:.79rem;line-height:1.45;color:var(--suave)}
  .rotulo{font-size:.71rem;text-transform:uppercase;letter-spacing:.07em;font-weight:650;
    color:var(--tenue)}
  .preg{font-size:1rem;font-weight:590;line-height:1.35;display:block}
  .bloque{display:flex;flex-direction:column;gap:8px}

  /* --------------------------------------------------------- tarjetas */
  .caja{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:13px}
  .caja.tenue{background:var(--fondo2);border-color:var(--linea2)}
  /* Aviso sin franja lateral: borde completo, fondo teñido y un icono. */
  .nota{background:var(--alerta-piso);border:1px solid var(--alerta-linea);
    border-radius:var(--r);padding:13px 14px;font-size:.88rem;line-height:1.45;
    display:flex;gap:11px;align-items:flex-start}
  .nota svg{flex:0 0 auto;margin-top:1px;color:var(--alerta)}

  /* --------------------------------------------------------- opciones */
  .lista{display:flex;flex-direction:column;gap:6px}
  /* `position:relative` en todo lo que esconde un input adentro: si el input
     absoluto no tiene un ancestro posicionado, el navegador lo ubica contra el
     documento y al enfocarlo con el teclado la página salta al principio. */
  .op{position:relative;display:flex;gap:11px;align-items:flex-start;padding:11px 13px;
    border:1px solid var(--linea);border-radius:var(--r-chico);background:var(--papel);
    cursor:pointer;font-size:.95rem;line-height:1.35;
    transition:border-color .15s,background .15s}
  .op .marca{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--linea);
    margin-top:1px;display:grid;place-items:center;transition:border-color .15s}
  .op.cuadro .marca{border-radius:5px}
  .op .marca i{width:9px;height:9px;border-radius:50%;background:transparent;transition:background .15s}
  .op.cuadro .marca i{border-radius:2px}
  .op.on{border-color:var(--acento);background:var(--acento-piso)}
  .op.on .marca{border-color:var(--acento)}
  .op.on .marca i{background:var(--acento)}
  .op .sub{display:block;font-size:.81rem;color:var(--suave);margin-top:1px}
  .op input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

  /* Fichas: para preguntas de muchas opciones cortas. Mucho más compacto que
     una lista apilada, y en teléfono se barren con el pulgar. */
  .fichas{display:flex;flex-wrap:wrap;gap:7px}
  .ficha{position:relative;display:inline-flex;align-items:center;min-height:42px;padding:8px 15px;
    border:1px solid var(--linea);border-radius:999px;background:var(--papel);
    font-size:.92rem;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
  .ficha.on{background:var(--acento);border-color:var(--acento);color:var(--papel);font-weight:560}
  .ficha input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .ficha.off{opacity:.45;cursor:not-allowed}
  @media (hover:hover){
    .op:hover{border-color:var(--acento-linea)}
    .ficha:hover{border-color:var(--acento-linea)}
    .ficha.on:hover{border-color:var(--acento)}
  }
  @media (pointer:coarse){ .ficha{min-height:44px} .op{padding:12px 13px} }
  .op:has(input:focus-visible),.ficha:has(input:focus-visible){
    outline:2px solid var(--acento);outline-offset:2px}
  /* Respaldo para navegadores sin :has(). El input va en opacity:0, asi que sin
     esto en un Chrome viejo el foco por teclado no se ve en ningun lado. Va por
     hermano, que funciona desde siempre. */
  .op input:focus-visible ~ .marca,
  .ficha input:focus-visible + .txt,
  .elegir input:focus-visible + .txt{
    outline:2px solid var(--acento);outline-offset:3px;border-radius:5px}

  /* ---------------------------------------------------------- botones */
  button{font:inherit;cursor:pointer}
  .pri,.sec{font-weight:600;border-radius:var(--r-chico);padding:11px 18px;min-height:44px;
    border:1px solid var(--acento);transition:background .15s,border-color .15s}
  .pri{background:var(--acento);color:var(--papel)}
  .sec{background:transparent;color:var(--acento)}
  @media (hover:hover){ .pri:hover{background:var(--acento-hover);border-color:var(--acento-hover)}
    .sec:hover{background:var(--acento-piso)} }
  .pri:disabled,.sec:disabled{opacity:.4;cursor:not-allowed}
  .pri:focus-visible,.sec:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

  /* -------------------------------------------------- campos numéricos */
  .campo{display:flex;flex-direction:column;gap:6px}
  .campo .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .eco{font-size:.8rem;font-weight:620;color:var(--acento);white-space:nowrap}
  .caja-num{display:flex;align-items:stretch;border:1px solid var(--linea);
    border-radius:var(--r-chico);background:var(--papel);overflow:hidden;max-width:230px}
  .caja-num:focus-within{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-piso)}
  .caja-num .sig{display:grid;place-items:center;padding:0 12px;background:var(--fondo2);
    border-right:1px solid var(--linea);color:var(--suave);font-weight:600;font-size:.95rem}
  .caja-num input{flex:1 1 auto;border:0;outline:0;background:transparent;color:var(--tinta);
    padding:12px 13px;font:inherit;font-weight:560;min-width:0;width:100%}

  /* ------------------------------------------------------------ escala */
  .escala{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  @media(min-width:480px){ .escala{grid-template-columns:repeat(10,1fr)} }
  .escala button{min-height:46px;border:1px solid var(--linea);border-radius:var(--r-chico);
    background:var(--papel);color:var(--tinta);font-weight:560;font-size:.98rem;
    transition:background .15s,border-color .15s,color .15s}
  .escala button.on{background:var(--acento);border-color:var(--acento);color:var(--papel)}
  .extremos{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--suave)}

  /* =================================================== la comparación */
  /* Una matriz, no tres tarjetas apiladas.

     🔴 La columna de rótulos a la izquierda está TAMBIÉN en teléfono, y eso se
     midió, no se intuyó. La primera versión ponía el rótulo del atributo en una
     franja de ancho completo arriba de cada fila de tres valores: cinco franjas
     de 21 px que suman 105 px de alto puro. Con esa variante la pantalla del
     experimento pedía 1.131 px, y un iPhone de 844 px deja unos 700 útiles una
     vez que Safari pone sus barras. Con el rótulo al costado ese alto se va a
     cero, porque la columna nunca es más alta que la fila que acompaña. El
     precio de esa decisión es que las celdas quedan de 93 px de ancho, y de ahí
     viene que las etiquetas de los niveles tengan que ser cortas. */
  .cmp{display:grid;grid-template-columns:72px repeat(3,1fr);
    border:1px solid var(--linea);border-radius:var(--r);background:var(--papel);
    overflow:hidden}
  .cmp .esquina{border-top:1px solid var(--linea2)}
  .cmp .esquina.sin-linea{border-top:0}
  .cmp .banda{display:flex;align-items:center;gap:6px;
    padding:6px 8px;background:var(--fondo2);border-top:1px solid var(--linea2);
    font-size:.70rem;line-height:1.18;letter-spacing:.005em;overflow-wrap:break-word;
    font-weight:620;color:var(--suave)}
  /* El icono del atributo no entra en 78 px sin comerse el rótulo: aparece en
     pantalla grande y en la glosa previa, que es donde se explica cada uno. */
  .cmp .banda svg{display:none;color:var(--tenue);flex:0 0 auto}
  .celda{padding:6px 7px;font-size:.8rem;line-height:1.2;border-top:1px solid var(--linea2);
    border-left:1px solid var(--linea2);transition:background .15s}
  .celda b{font-weight:620;display:block;font-size:.81rem;line-height:1.22}
  .celda span{display:block;color:var(--suave);font-size:.70rem;line-height:1.2}
  .celda.on{background:var(--acento-piso)}

  .cab-plan{padding:6px 5px 7px;text-align:center;cursor:pointer;
    border-top:0;border-left:1px solid var(--linea2);transition:background .15s}
  .cab-plan .letra{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;
    background:var(--fondo2);color:var(--suave);font-size:.62rem;font-weight:680;
    margin-bottom:2px;transition:background .15s,color .15s}
  .cab-plan .precio{font-size:.97rem;font-weight:700;letter-spacing:-.03em;white-space:nowrap;
    line-height:1.15}
  .cab-plan.on{background:var(--acento-piso)}
  .cab-plan.on .letra{background:var(--acento);color:var(--papel)}

  .pie-cmp{padding:6px 5px 7px;border-top:1px solid var(--linea2);
    border-left:1px solid var(--linea2)}
  .elegir{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;
    min-height:42px;padding:6px 3px;border:1px solid var(--acento-linea);
    border-radius:var(--r-chico);background:var(--papel);color:var(--acento);
    font-size:.79rem;font-weight:620;cursor:pointer;text-align:center;
    transition:background .15s,color .15s,border-color .15s}
  .elegir .txt{display:inline-flex;align-items:center;gap:4px}
  .elegir.on{background:var(--acento);border-color:var(--acento);color:var(--papel)}
  .elegir input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .elegir:has(input:focus-visible){outline:2px solid var(--tinta);outline-offset:2px}
  @media (hover:hover){ .elegir:hover{background:var(--acento-piso)}
    .elegir.on:hover{background:var(--acento-hover)} }

  /* En pantalla angosta todo esta al minimo porque cada pixel se necesita
     para que la comparacion entre. Desde 560 px sobra lugar: se devuelve. */
  @media(max-width:379px){
    .lienzo{padding:8px 0 10px}
    .lienzo .centro{gap:7px}
    .cab-tarea h2{font-size:.95rem}
    .dual p.micro{font-size:.735rem;line-height:1.34}
    .celda{padding:5px 6px}
    .cab-plan{padding:5px 4px 6px}
    .pie .centro{padding-top:7px;padding-bottom:7px}
    .cmp{grid-template-columns:60px repeat(3,1fr)}
    .celda b{font-size:.78rem}
    .celda span{font-size:.675rem}
    .cab-plan .precio{font-size:.92rem}
    .cmp .banda{padding:6px 5px;font-size:.67rem}
  }
  @media(min-width:560px){
    .lienzo{padding:18px 0 22px}
    .lienzo .centro{gap:14px}
    .cmp{grid-template-columns:150px repeat(3,1fr)}
    .cmp .banda{padding:8px 11px;font-size:.75rem}
    .cmp .banda svg{display:block}
    .celda{font-size:.87rem;padding:9px 12px;line-height:1.3}
    .celda b{font-size:.9rem}
    .celda span{font-size:.78rem}
    .cab-plan{padding:11px 10px 12px}
    .cab-plan .letra{width:22px;height:22px;font-size:.74rem;margin-bottom:5px}
    .cab-plan .precio{font-size:1.18rem}
    .pie-cmp{padding:9px 9px 10px}
    .elegir{font-size:.85rem;min-height:44px}
  }

  /* las dos respuestas de cada pantalla del experimento */
  .dual{display:flex;flex-direction:column;gap:7px}
  .dual .fichas .ficha{flex:1 1 0;justify-content:center;text-align:center;min-width:132px}
  .cab-tarea{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .cab-tarea h2{font-size:1rem}

  /* ----------------------------------------------------------- varios */
  .pasos-expl{display:flex;flex-direction:column;gap:11px}
  .paso-expl{display:flex;gap:12px;align-items:flex-start}
  .paso-expl .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--acento);
    color:var(--papel);display:grid;place-items:center;font-size:.8rem;font-weight:680}
  .paso-expl div{font-size:.93rem;line-height:1.4}
  .glosa{display:flex;flex-direction:column;gap:0;border:1px solid var(--linea);
    border-radius:var(--r);background:var(--papel);overflow:hidden}
  .glosa-fila{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--linea2);
    align-items:flex-start}
  .glosa-fila:first-child{border-top:0}
  .glosa-fila svg{flex:0 0 auto;color:var(--acento);margin-top:2px}
  .glosa-fila b{font-size:.86rem;font-weight:630;display:block;line-height:1.25}
  .glosa-fila span{font-size:.80rem;color:var(--suave);line-height:1.33}
  .dos{display:grid;gap:10px}
  @media(min-width:560px){ .dos{grid-template-columns:1fr 1fr} }
  .grande{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    padding:17px 16px;border:1px solid var(--linea);border-radius:var(--r);
    background:var(--papel);cursor:pointer;text-align:left;width:100%;
    transition:border-color .15s,background .15s}
  .grande.on{border-color:var(--acento);background:var(--acento-piso)}
  .grande svg{color:var(--acento)}
  .grande b{font-size:1.02rem;font-weight:640}
  .grande em{font-style:normal;font-size:.84rem;color:var(--suave)}
  .grande input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  @media (hover:hover){ .grande:hover{border-color:var(--acento-linea)} }

  details.mas{border:1px solid var(--linea);border-radius:var(--r-chico);background:var(--papel)}
  details.mas + details.mas{margin-top:6px}
  details.mas > summary{padding:10px 12px;cursor:pointer;font-size:.89rem;font-weight:570;
    list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
  details.mas > summary::-webkit-details-marker{display:none}
  details.mas > summary::after{content:"+";color:var(--acento);font-weight:700;font-size:1.1rem;
    line-height:1}
  details.mas[open] > summary::after{content:"\2013"}
  details.mas > div{padding:0 13px 12px;font-size:.87rem;line-height:1.5;color:var(--suave)}
  details.mas > div p + p{margin-top:.6em}

  .aviso-err{background:var(--alerta-piso);border:1px solid var(--alerta-linea);
    color:var(--alerta);border-radius:var(--r-chico);padding:9px 12px;font-size:.86rem;
    font-weight:570;line-height:1.35}
  code.volcado{display:block;background:var(--fondo2);border:1px solid var(--linea);
    padding:13px;border-radius:var(--r-chico);font-size:.76rem;word-break:break-all;
    max-height:180px;overflow:auto}
  .cierre{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px 0}
  .cierre .tilde{width:46px;height:46px;border-radius:50%;background:var(--acento-piso);
    display:grid;place-items:center;color:var(--acento)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

/* ---------------------------------------------------------------- estado */
const LS = "encuesta-montana-utdt";
/* El canal de reclutamiento viene en la URL (?c=pauta, ?c=red, ?c=com) y no se le
   pregunta a la persona: preguntarlo da un dato malo, porque nadie se acuerda por dónde
   llegó. Es el dato que sostiene la promesa metodológica de reportar por canal, que es
   la defensa contra el sesgo de autoselección. Si falta, queda "sin_etiqueta", se
   reporta como tal y recién entonces se pregunta. */
function canalDeUrl(){
  try {
    const c = (new URLSearchParams(location.search).get("c") || "").toLowerCase();
    return ["pauta","red","com","piloto"].includes(c) ? c : "sin_etiqueta";
  } catch(e) { return "sin_etiqueta"; }
}

function nuevoId(){
  return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
}
function estadoNuevo(){
  return {
    id: nuevoId(),
    bloque: Math.floor(Math.random()*DISENO.bloques.length),
    iniciado: new Date().toISOString(),
    canal: canalDeUrl(),
    /* El dispositivo se registra solo, sin preguntar: sirve para leer el abandono, que
       en encuestas largas se concentra en teléfono. */
    pantalla: (typeof screen !== "undefined" ? screen.width + "x" + screen.height : "?"),
    movil: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || ""),
    paso: 0,
    r: {},            // respuestas de las preguntas
    elecciones: [],   // una por tarea
    orden: null,      // orden aleatorio de las tareas
    ordenAtr: null,   // orden de los atributos dentro de la tarjeta
    version: CONFIG.version
  };
}

let S = cargar() || estadoNuevo();
/* Si alguien retoma con otro link etiquetado, el canal del primer ingreso manda. */
if (!S.canal) { S.canal = canalDeUrl(); guardar(); }

function guardar(){
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){ /* modo privado */ }
}
function cargar(){
  try { const x = localStorage.getItem(LS); return x ? JSON.parse(x) : null; }
  catch(e){ return null; }
}

/* ------------------------------------------------- guardado en el servidor

   Cada paso completado manda un SNAPSHOT del estado entero, no un fragmento.
   Dos razones, y las dos importan:

   · Si alguien abandona a mitad de camino, la respuesta parcial ya está guardada
     y se sabe en qué paso se fue. El abandono en encuestas largas no es aleatorio
     (deserta más el menos interesado), así que medirlo es parte del dato.
   · Como cada envío es autosuficiente, un envío que falla no pierde nada: el
     siguiente lleva todo de nuevo. No hace falta reintentar lo viejo.

   La tabla es append-only con un índice único por (respuesta, paso, completo):
   reenviar el mismo paso no duplica, devuelve 409 y se ignora. 🔴 El `completo`
   tiene que estar en la clave: sin él, el envío final choca con el autoguardado
   del último paso, devuelve 409, y la respuesta queda marcada como incompleta
   para siempre mientras la persona ve "Listo, gracias".
*/
let ultimoPasoEnviado = -1;

async function sincronizar(completo){
  if (!CONFIG.endpoint) return false;
  if (!completo && S.paso <= ultimoPasoEnviado) return true;   // ya lo mandé
  const fila = {
    respuesta_id: S.id,
    paso: S.paso,
    completo: !!completo,
    bloque: S.bloque,
    version: CONFIG.version,
    payload: S
  };
  try {
    const res = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: {
        "apikey": CONFIG.apikey,
        "Content-Type": "application/json",
        /* Solo return=minimal. NO usar resolution=ignore-duplicates: PostgREST lo
           implementa como upsert y eso necesita permiso de UPDATE, que esta clave no
           tiene a propósito. El reenvío del mismo paso devuelve 409 por el índice
           único y acá abajo se trata como éxito, que es lo que es. */
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(fila),
      keepalive: true        // que el envío sobreviva si la pestaña se cierra
    });
    if (res.ok || res.status === 409) { ultimoPasoEnviado = S.paso; return true; }
    return false;
  } catch(e) { return false; }
}

/* Si la persona cierra la pestaña a mitad de camino, intentar un último guardado.
   `keepalive` permite que el pedido salga aunque la página se esté yendo. */
window.addEventListener("pagehide", () => {
  if (S.r.consentimiento && !S.terminado) sincronizar(false);
});

/* ---------------------------------------------- azar con semilla estable */
function semillaDeId(){
  /* Hash del id del respondente, para que la permutación de pantalla varíe ENTRE personas
     y no solo entre pantallas. 🔴 Antes la semilla era (i+1)*constante, o sea que todos
     veían la misma permutación en la pantalla 3. En las diez tareas de estimación se
     salvaba de rebote porque el orden de tareas cambia, pero las TRES FIJAS están clavadas
     en las pantallas 0, 6 y 12: la posición quedaba confundida con el perfil para los 150
     respondentes, y justamente esas tres son las que miden el acierto del modelo. */
  let h = 2166136261;
  for (const ch of String(S.id)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return Math.abs(h) || 1;
}

/* Generador pseudoaleatorio decente, con semilla reproducible.
   🔴 Antes acá había un congruencial lineal casero con `x % (k+1)`, y sobre tres elementos
   producía SOLO 3 de las 6 permutaciones posibles: el primer perfil no caía nunca en la
   posición A. Verificado sobre 3.000 identificadores. Eso reintroducía justo el sesgo de
   posición que la función existe para evitar. Mulberry32 pasa las pruebas de uniformidad
   y no cuesta nada. */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mezclar(arr, semilla){
  const a = arr.slice();
  const rnd = mulberry32(semilla);
  rnd(); rnd();                        // descartar los dos primeros, que correlacionan con la semilla
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(rnd() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}
function posiciones(i, n){
  return mezclar([...Array(n).keys()], (semillaDeId() ^ Math.imul(i + 1, 2654435761)) | 0);
}
/* El orden de los atributos dentro de la tarjeta se mezcla UNA VEZ por respondente y se
   guarda: el primer atributo de una tarjeta pesa más que el último, así que dejarlo fijo
   para todos le regala importancia al mismo atributo en los 150 casos. La cuota va siempre
   primera y aparte, porque es el ancla de precio y así se presenta en la literatura. */
function ordenAtributos(){
  if (S.ordenAtr) return S.ordenAtr;
  S.ordenAtr = mezclar(ORDEN_MOSTRAR, semillaDeId());
  guardar();
  return S.ordenAtr;
}
/* el orden de las tareas se fija una vez por persona */
function ordenTareas(){
  if (S.orden) return S.orden;
  const n = DISENO.bloques[S.bloque].length;
  const idx = [...Array(n).keys()];
  for (let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  /* Solo el orden de las diez tareas de estimacion: cuales son las fijas y en
     que pantalla van es fijo para todos y lo resuelve tareaDe(). */
  S.orden = {estimacion: idx};
  guardar();
  return S.orden;
}

/* ------------------------------------------------------------- utilidades */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ico(nombre, tam){
  const t = tam || 18;
  return `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
    ><use href="#g-${nombre}"/></svg>`;
}
function fallo(msg){
  const e = document.getElementById("aviso-pie");
  if (e) { e.textContent = msg; e.hidden = false; }
  return false;
}
function bien(){
  const e = document.getElementById("aviso-pie");

  return true;
}

/* Las opciones aceptan dos formas: un texto (se guarda y se muestra igual) o
   {v, l, s} con v = lo que se guarda, l = lo que se muestra, s = subtexto.
   Separar las dos cosas permite mostrar "de $800 mil a $1,5 M" y guardar
   "Más de $800.000 y hasta $1.500.000", que es lo que no deja ninguna duda
   al analizar. */
function norm(o){
  return (typeof o === "string") ? {v:o, l:o} : {v:o.v, l:o.l || o.v, s:o.s};
}
/* Cada pregunta vuelve envuelta en un solo `.bloque`: así la pregunta y sus
   opciones quedan pegadas (9 px) y la separación grande (14 px) queda entre
   preguntas. Si cada widget devolviera dos hermanos sueltos, el gap del lienzo
   se metería entre el enunciado y sus opciones y en pantalla se leería como si
   las opciones fueran de otra cosa. */
function radio(campo, texto, ops, modo){
  const fichas = modo === "fichas";
  let h = `<div class="bloque">`;
  h += texto ? `<span class="preg">${texto}</span>` : "";
  h += fichas ? `<div class="fichas">` : `<div class="lista">`;
  ops.map(norm).forEach(o => {
    const on = S.r[campo] === o.v;
    h += fichas
      ? `<label class="ficha${on?" on":""}" title="${esc(o.v)}"><input type="radio" name="${campo}"
           ${on?"checked":""} data-v="${esc(o.v)}" onchange="setR('${campo}',this.dataset.v)"><span class="txt">${o.l}</span></label>`
      : `<label class="op${on?" on":""}"><input type="radio" name="${campo}"
           ${on?"checked":""} data-v="${esc(o.v)}" onchange="setR('${campo}',this.dataset.v)"
           ><span class="marca"><i></i></span><span>${o.l}${o.s?`<span class="sub">${o.s}</span>`:""}</span></label>`;
  });
  return h + `</div></div>`;
}
function check(campo, texto, ops, modo){
  const fichas = modo === "fichas";
  const act = S.r[campo] || [];
  let h = `<div class="bloque">`;
  h += texto ? `<span class="preg">${texto}</span>` : "";
  h += fichas ? `<div class="fichas">` : `<div class="lista">`;
  ops.map(norm).forEach(o => {
    const on = act.includes(o.v);
    h += fichas
      ? `<label class="ficha${on?" on":""}" title="${esc(o.v)}"><input type="checkbox"
           ${on?"checked":""} data-v="${esc(o.v)}" onchange="togR('${campo}',this.dataset.v)"><span class="txt">${o.l}</span></label>`
      : `<label class="op cuadro${on?" on":""}"><input type="checkbox"
           ${on?"checked":""} data-v="${esc(o.v)}" onchange="togR('${campo}',this.dataset.v)"
           ><span class="marca"><i></i></span><span>${o.l}</span></label>`;
  });
  return h + `</div></div>`;
}
/* Campo numérico que acepta cómo la gente escribe de verdad.
   🔴 Antes era <input type="number">, y ahí "1.200.000" tecleado con puntos devuelve
   value = "": la persona veía su número en la caja y el dato no se guardaba en ningún
   lado. Pasa justo en las preguntas de plata, que son las más caras de volver a pedir.
   Ahora es text, se limpian los separadores, y al lado de la pregunta se muestra lo que
   QUEDÓ guardado, que es la única forma de que un recorte por tope no sea invisible. */
function num(campo, texto, min, max){
  const g = S.r[campo];
  const plata = max > 10000;
  const eco = g !== undefined
    ? `<span class="eco">${plata?"$":""}${g.toLocaleString("es-AR")}</span>` : "";
  return `<div class="campo" data-campo="${campo}">
    <div class="cab"><label class="preg" for="f-${campo}">${texto}</label>${eco}</div>
    <div class="caja-num">${plata?`<span class="sig">$</span>`:""}
      <input id="f-${campo}" type="text" inputmode="numeric" autocomplete="off"
        value="${g !== undefined ? g : ""}"
        oninput="setNum('${campo}', this.value, ${min}, ${max})"></div>
  </div>`;
}
function escala(campo, texto, izq, der){
  let h = `<div class="bloque"><span class="preg">${texto}</span><div class="escala">`;
  for (let i=1;i<=10;i++){
    h += `<button type="button" class="${S.r[campo]===i?"on":""}"
      onclick="setR('${campo}',${i})">${i}</button>`;
  }
  return h + `</div><div class="extremos"><span>${izq}</span><span>${der}</span></div></div>`;
}

window.setR = (c,v) => { S.r[c] = v; guardar(); pintar(); };
window.togR = (c,v) => {
  const a = S.r[c] || [];
  if (a.includes(v)) { S.r[c] = a.filter(x=>x!==v); }
  else {
    /* Tope de dos en la pregunta de los meses sin viaje: forzar la prioridad da más
       información que dejar marcar todo, que es lo mismo que no preguntar. */
    const tope = (c === "sin_viaje") ? 2 : 99;
    S.r[c] = a.length >= tope ? a.slice(1).concat([v]) : a.concat([v]);
  }
  guardar(); pintar();
};
window.setNum = (c,v,min,max) => {
  /* Se limpian puntos, comas, espacios y el signo de pesos: "$ 1.200.000" -> 1200000.
     Sin esto, escribir un monto con separadores de miles no guardaba nada. */
  const limpio = String(v).replace(/[^0-9]/g, "");
  if (limpio === "") { delete S.r[c]; guardar(); pintar(); return; }
  let n = Number(limpio);
  if (!Number.isFinite(n)) return;
  n = Math.max(min, Math.min(max, n));
  const cambio = S.r[c] !== n;
  S.r[c] = n;
  /* Si bajan las contratadas por debajo de las canceladas, se recorta en el acto: dejarlo
     inconsistente hasta apretar "Seguir" muestra un error que el usuario no entiende. */
  if (c === "contrato_2a" && S.r.cancelo_2a > n) { S.r.cancelo_2a = n; guardar(); pintar(); return; }
  guardar();
  /* El tope del campo de canceladas depende de las contratadas, y está embebido en el HTML:
     sin repintar, el input se queda con el tope viejo y acepta un valor que después rebota. */
  if (c === "contrato_2a" && cambio) { pintar(); return; }
  /* Repintar solo cuando el valor guardado difiere de lo tecleado (un recorte por tope),
     para que el eco de al lado no mienta. Repintar siempre movería el cursor en cada letra. */
  if (cambio && String(n) !== limpio) { pintar(); return; }
  if (cambio) {
    const caja = document.querySelector('.campo[data-campo="'+c+'"] .cab');
    if (caja) {
      const plata = max > 10000;
      const txt = (plata ? "$" : "") + n.toLocaleString("es-AR");
      let eco = caja.querySelector(".eco");
      if (eco) eco.textContent = txt;
      else caja.insertAdjacentHTML("beforeend", '<span class="eco">' + txt + '</span>');
    }
  }
};
function req(campo, msg){ return S.r[campo] !== undefined ? bien() : fallo(msg); }

function tareaDe(i){
  /* devuelve {perfiles, tipo, ref} — tipo: 'est' | 'fija'
     Las fijas van en las posiciones 0, 6 y 12 (la última repite la primera fija). */
  const o = ordenTareas();
  if (i === 0)  return {perfiles: DISENO.fijas[0], tipo:"fija", ref:"fija-1"};
  if (i === 6)  return {perfiles: DISENO.fijas[1], tipo:"fija", ref:"fija-2"};
  if (i === 12) return {perfiles: DISENO.fijas[0], tipo:"fija", ref:"fija-1-repetida"};
  const mapa = [null,0,1,2,3,4,null,5,6,7,8,9,null];
  const k = mapa[i];
  return {perfiles: DISENO.bloques[S.bloque][o.estimacion[k]], tipo:"est",
          ref:"est-" + o.estimacion[k]};
}
function textoNivel(j, nivel){ return ATR[j].niveles[nivel]; }

function pintarTarea(i){
  const T = tareaDe(i);
  const pos = posiciones(i, T.perfiles.length);
  const yaEl = S.elecciones[i] || {};
  const elegido = yaEl.elegido;

  /* Encabezado de cada columna: letra y cuota. La cuota va acá y no como una fila
     más porque es el ancla de precio de la tarjeta, y así se presenta en la
     literatura de elección discreta. */
  let cab = `<div class="esquina sin-linea"></div>`;
  let filas = "";
  let pies = `<div class="esquina"></div>`;

  pos.forEach((pIdx, vis) => {
    const p = T.perfiles[pIdx];
    const on = elegido === pIdx ? " on" : "";
    cab += `<div class="cab-plan${on}" data-c="${vis}" onclick="elegirPlan(${i},${pIdx})">
      <div class="letra">${"ABC"[vis]}</div>
      <div class="precio">${textoNivel(0,p[0])}</div></div>`;
    pies += `<div class="pie-cmp" data-c="${vis}">
      <label class="elegir${on}">
        <input type="radio" name="plan-${i}" ${on?"checked":""}
          onchange="elegirPlan(${i},${pIdx})"><span class="txt">${
          on ? ico("tilde",15) + "Elegido" : "Elegir " + "ABC"[vis]}</span>
      </label></div>`;
  });

  ordenAtributos().forEach(nom => {
    const j = ATR.findIndex(a => a.nombre === nom);
    filas += `<div class="banda">${ico(ETIQ[nom].ic,14)}${ETIQ[nom].b}</div>`;
    pos.forEach((pIdx, vis) => {
      const p = T.perfiles[pIdx];
      const c = CORTO[nom][p[j]];
      const on = elegido === pIdx ? " on" : "";
      filas += `<div class="celda${on}" data-c="${vis}" onclick="elegirPlan(${i},${pIdx})"
        title="${esc(textoNivel(j,p[j]))}">
        <b>${c.v}</b>${c.s?`<span>${c.s}</span>`:""}</div>`;
    });
  });

  /* 🔴 El texto cambia según la rama. Decirle "como hacés hoy" a alguien que no hizo
     ninguna salida en dos años es falso, y la proporción de no compra es justamente el
     estadístico con el que se prueba la tercera hipótesis: si la frase no aplica, el dato
     no mide lo que se cree que mide. */
  const practica = S.r.hizo === "Sí";
  const compra = yaEl.compraria;
  /* El recordatorio de no compra tiene que estar en TODAS las pantallas, no una
     vez: es lo que sostiene la interpretación de la proporción de no compra. Lo
     que se movió a la glosa previa es la DESCRIPCIÓN de precios de la alternativa
     de hoy, que es constante y ocupaba 92 px en cada una de las trece pantallas. */
  const alterna = practica ? "seguís comprando salida por salida, como hoy"
                           : "seguís pagando cada salida cuando la hagas";

  return `
  <div class="cab-tarea">
    <h2>Pantalla ${i+1} de 13</h2>
    <span class="rotulo">Cuota por mes</span>
  </div>
  <p class="micro">¿Cuál preferirías? Elegí uno aunque ninguno te guste.</p>

  <div class="cmp">${cab}${filas}${pies}</div>

  <div class="dual">
    <span class="preg">${elegido === undefined
      ? "Elegí un plan y después contestá acá."
      : `¿Contratarías el plan ${"ABC"[pos.indexOf(elegido)]}?`}</span>
    <div class="fichas">
      <label class="ficha${compra==="plan"?" on":""}${elegido===undefined?" off":""}">
        <input type="radio" name="compra-${i}" ${compra==="plan"?"checked":""}
          ${elegido===undefined?"disabled":""} onchange="setEl(${i},'compraria','plan')"
          ><span class="txt">Sí, lo contrato</span></label>
      <label class="ficha${compra==="ninguno"?" on":""}${elegido===undefined?" off":""}">
        <input type="radio" name="compra-${i}" ${compra==="ninguno"?"checked":""}
          ${elegido===undefined?"disabled":""} onchange="setEl(${i},'compraria','ninguno')"
          ><span class="txt">No, sigo como hoy</span></label>
    </div>
    <p class="micro">Si te parecen caros, no contratar ninguno es una respuesta válida:
    ${alterna}. Suelto sale <b>$280.000</b> al contado o <b>3 cuotas de $103.000</b>, sin
    garantía de que salga y en grupo de hasta 15.</p>
  </div>`;
}

window.elegirPlan = (i, pIdx) => {
  S.elecciones[i] = Object.assign({}, S.elecciones[i], {elegido: pIdx, ts: Date.now()});
  guardar(); pintar();
};
window.setEl = (i, campo, val) => {
  S.elecciones[i] = Object.assign({}, S.elecciones[i], {[campo]: val});
  guardar(); pintar();
};

function validarTarea(i){
  const e = S.elecciones[i] || {};
  if (e.elegido === undefined) return fallo("Elegí uno de los tres planes.");
  if (e.compraria === undefined) return fallo("Falta la segunda: ¿lo contratarías o no?");
  const T = tareaDe(i);
  S.elecciones[i].ref = T.ref;
  S.elecciones[i].tipo = T.tipo;
  S.elecciones[i].perfiles = T.perfiles;
  guardar();
  return bien();
}

/* ================================================================ navegación */
function pasosVisibles(){ return PASOS.map((p,i) => ({p,i})).filter(x => x.p.visible()); }

window.siguiente = () => {
  const act = PASOS[S.paso];
  if (act.valida && !act.valida()) return;
  let n = S.paso + 1;
  while (n < PASOS.length && !PASOS[n].visible()) n++;
  if (n >= PASOS.length) return;
  S.paso = n; guardar(); pintar(); window.scrollTo(0,0);
  /* Se guarda en el servidor después de avanzar, sin await: la persona no espera
     por la red. Solo a partir del consentimiento, nunca antes. */
  if (S.r.consentimiento) sincronizar(false);
};
window.anterior = () => {
  let n = S.paso - 1;
  while (n > 0 && !PASOS[n].visible()) n--;
  S.paso = Math.max(0, n); guardar(); pintar(); window.scrollTo(0,0);
};

function pintar(){
  const paso = PASOS[S.paso];
  app.innerHTML = paso.render();
  const pie = document.getElementById("pie-in");
  const cajaPie = document.getElementById("pie");
  pie.innerHTML = paso.pie ? paso.pie() : pieEstandar("Seguir", null, S.paso === 0);
  cajaPie.hidden = false;

  const vis = pasosVisibles();
  const pos = vis.findIndex(x => x.i === S.paso);
  const top = document.getElementById("top");
  if (S.paso > 0 && pos >= 0) {
    top.hidden = false;
    document.getElementById("barra").style.width =
      Math.round(100*pos/(vis.length-1)) + "%";
    document.getElementById("seccion").textContent = paso.seccion || "";
    document.getElementById("paso-txt").textContent = (pos+1) + " de " + vis.length;
    /* `S.paso` es el indice crudo dentro de PASOS y asi tiene que quedar, porque
       es parte de la clave unica de la tabla. Pero no sirve para leer el abandono:
       las dos ramas saltean pasos distintos, asi que el paso 10 de quien practica
       y el de quien no son momentos distintos de la encuesta. Estos dos si se
       pueden comparar entre ramas. */
    S.paso_visible = pos + 1;
    S.pasos_totales = vis.length;
  } else { top.hidden = true; }
}

/* ==================================================================== envío */
window.enviar = async () => {
  const act = PASOS[S.paso];
  if (act.valida && !act.valida()) return;
  S.terminado = new Date().toISOString();
  S.bloque_id = S.bloque;
  S.diseno_derror = DISENO.derror;
  guardar();

  const payload = JSON.stringify(S);
  app.innerHTML = `<h2>Enviando…</h2><p class="intro">Un segundo.</p>`;
  document.getElementById("pie").hidden = true;

  /* Dos intentos con una espera en el medio: la mayoría de los fallos de red son
     momentáneos, y acá la respuesta ya está completa y sería una pena perderla. */
  let ok = await sincronizar(true);
  if (!ok) {
    await new Promise(r => setTimeout(r, 1500));
    ok = await sincronizar(true);
  }

  if (ok) {
    try { localStorage.removeItem(LS); } catch(e){}
    app.innerHTML = cierreOk();
  } else {
    /* La via de respaldo existe porque una respuesta completa que se pierde por un error de
       red es una respuesta que hay que volver a conseguir. */
    app.innerHTML = `<h2>Casi listo</h2>
      <div class="nota">${ico("aviso",19)}<div><b>Terminaste, pero no pude confirmar el último
        envío.</b> Lo más probable es que haya quedado guardado igual, porque la encuesta va
        guardando a medida que avanzás. Si querés asegurarte, probá reintentar.</div></div>
      <div class="acciones">
        <button type="button" class="pri" onclick="reintentar()">Reintentar el envío</button>
        <button type="button" class="sec" onclick="verVolcado()">Copiar a mano</button>
      </div>
      <div id="respaldo" hidden class="bloque">
        <p class="micro">Copiá este texto y mandámelo por donde me escribiste.</p>
        <button type="button" class="sec" onclick="copiar()">Copiar el texto</button>
        <code class="volcado" id="volcado">${esc(payload)}</code>
      </div>`;
  }
  document.getElementById("top").hidden = true;
};

/* El cierre no menciona la tesis: a esta altura la persona ya leyó para qué es
   tres veces. Agradecer y nada más. */
function cierreOk(){
  return `<div class="cierre">
    <div class="tilde">${ico("tilde",24)}</div>
    <h1>Listo</h1>
    <p class="intro">Gracias por tomarte el tiempo de responder y llegar hasta el final.</p>
  </div>`;
}

/* Dos personas que responden en el mismo teléfono (una charla, una reunión) compartirían
   el estado guardado: la segunda seguiría la encuesta de la primera. Esto le da salida.
   Se pregunta antes de borrar: un toque accidental en «¿No sos vos?» a mitad del
   experimento tiraría abajo doce minutos de respuestas. */
window.confirmarReinicio = (ev) => {
  if (ev) ev.preventDefault();
  if (confirm("Esto borra lo que está respondido en este dispositivo y empieza una encuesta nueva. ¿Seguimos?")) {
    empezarDeNuevo();
  }
};
window.empezarDeNuevo = () => {
  try { localStorage.removeItem(LS); } catch(e){}
  S = estadoNuevo();
  ultimoPasoEnviado = -1;
  guardar(); pintar(); window.scrollTo(0,0);
};

window.verVolcado = () => { document.getElementById("respaldo").hidden = false; };
window.reintentar = async () => {
  app.innerHTML = `<h2>Reintentando…</h2>`;
  ultimoPasoEnviado = -1;
  const ok = await sincronizar(true);
  if (ok) {
    try { localStorage.removeItem(LS); } catch(e){}
    app.innerHTML = cierreOk();
  } else {
    app.innerHTML = `<h2>Sigue sin conectar</h2>
      <div class="nota">${ico("aviso",19)}<div>Copiá el texto de abajo y mandámelo, así no se
        pierde.</div></div>
      <button type="button" class="sec" onclick="copiar()">Copiar el texto</button>
      <code class="volcado" id="volcado">${esc(JSON.stringify(S))}</code>`;
  }
};
window.copiar = () => {
  const t = document.getElementById("volcado").textContent;
  navigator.clipboard?.writeText(t).then(
    () => alert("Copiado. Mandámelo por WhatsApp o correo, gracias."),
    () => alert("No pude copiar. Seleccioná el texto a mano, por favor.")
  );
};

pintar();
</script>
