<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Encuesta sobre salidas de montaña — Tesis UTDT</title>
<style>
  :root{
    --tinta:#1a1a18; --suave:#5c5c56; --linea:#dcdcd4; --fondo:#faf9f6;
    --papel:#ffffff; --acento:#2d5f4f; --acento-claro:#eaf2ee; --alerta:#8a4b2a;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  .marco{max-width:680px;margin:0 auto;padding:20px 18px 60px}
  h1{font-size:1.45rem;line-height:1.25;margin:.2em 0 .4em;font-weight:650}
  h2{font-size:1.1rem;margin:1.6em 0 .5em;font-weight:650}
  p{margin:.6em 0}
  .chico{font-size:.86rem;color:var(--suave)}
  .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:12px;
    padding:18px;margin:14px 0}
  .progreso{position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:var(--fondo);
    padding:10px 0 8px;border-bottom:1px solid var(--linea);margin-bottom:6px}
  .barra{height:5px;background:var(--linea);border-radius:3px;overflow:hidden}
  .barra > i{display:block;height:100%;background:var(--acento);width:0;transition:width .25s}
  label{display:block;margin:.5em 0}
  input[type=number],input[type=text],select{width:100%;padding:11px 12px;font-size:1rem;
    border:1px solid var(--linea);border-radius:8px;background:var(--papel);color:var(--tinta)}
  .opcion{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--linea);
    border-radius:9px;margin:7px 0;cursor:pointer;background:var(--papel)}
  .opcion:hover{border-color:var(--acento)}
  .opcion input{margin-top:3px;flex:0 0 auto}
  .opcion.sel{border-color:var(--acento);background:var(--acento-claro)}
  button{font:inherit;font-weight:600;padding:13px 22px;border-radius:9px;border:1px solid var(--acento);
    background:var(--acento);color:#fff;cursor:pointer}
  button.sec{background:transparent;color:var(--acento)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .botones{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  table.plan{width:100%;border-collapse:collapse;font-size:.92rem}
  table.plan th{text-align:left;padding:7px 8px;background:#f2f1ec;font-weight:600;width:34%;
    vertical-align:top;border-bottom:1px solid var(--linea)}
  table.plan td{padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
  .planes{display:grid;gap:12px}
  @media(min-width:620px){.planes{grid-template-columns:repeat(3,1fr)}}
  .plan-box{border:1.5px solid var(--linea);border-radius:11px;overflow:hidden;background:var(--papel);
    cursor:pointer;display:flex;flex-direction:column}
  .plan-box:hover{border-color:var(--acento)}
  .plan-box.sel{border-color:var(--acento);box-shadow:0 0 0 2px var(--acento-claro)}
  .plan-cab{background:var(--acento);color:#fff;padding:9px 11px;font-weight:650;font-size:.95rem}
  .plan-box.sel .plan-cab{background:#1f4538}
  .plan-cuota{font-size:1.3rem;font-weight:700;padding:11px 11px 2px}
  .plan-cuota small{font-size:.75rem;font-weight:400;color:var(--suave);display:block}
  .plan-fila{padding:7px 11px;font-size:.87rem;border-top:1px solid #efeee9}
  .plan-fila b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;
    color:var(--suave);font-weight:600;margin-bottom:1px}
  .aviso{background:#fdf6ee;border-left:3px solid var(--alerta);padding:11px 13px;
    border-radius:0 7px 7px 0;font-size:.9rem;margin:14px 0}
  .recordatorio{background:#f2f1ec;padding:11px 13px;border-radius:8px;font-size:.88rem;
    color:var(--suave);margin:14px 0}
  .escala{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
  .escala button{flex:1 1 auto;min-width:38px;padding:11px 0;background:var(--papel);
    color:var(--tinta);border:1px solid var(--linea);font-weight:500}
  .escala button.sel{background:var(--acento);color:#fff;border-color:var(--acento)}
  .err{color:var(--alerta);font-size:.88rem;margin-top:8px;font-weight:600}
  code.codigo{display:block;background:#f2f1ec;padding:14px;border-radius:8px;font-size:.8rem;
    word-break:break-all;margin:12px 0;max-height:190px;overflow:auto}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="marco">
  <div class="progreso" id="progreso" hidden>
    <div class="barra"><i id="barra"></i></div>
    <div class="chico" style="margin-top:5px;display:flex;justify-content:space-between;gap:10px">
      <span id="paso-txt"></span>
      <!-- Tiene que estar en TODOS los pasos y no solo en la portada: al recargar, la
           página retoma donde quedó y la portada no se vuelve a ver nunca. Si el teléfono
           se presta a otra persona, esta es su única salida. -->
      <a href="#" id="reinicio" onclick="confirmarReinicio(event)"
         style="color:var(--suave);text-decoration:underline;white-space:nowrap">¿No sos vos?</a>
    </div>
  </div>
  <div id="app"></div>
</div>

const ETIQ = {
  cuota:    {titulo:"Cuota mensual",     ayuda:"Lo que pagás todos los meses, viajes o no"},
  cubre:    {titulo:"Alcanza para",      ayuda:"El crédito se junta mes a mes"},
  garantia: {titulo:"Si no junta gente", ayuda:"Hoy, si no llega al mínimo, se cancela"},
  grupo:    {titulo:"Tamaño del grupo",  ayuda:"Cuántas personas y cuántos guías"},
  destinos: {titulo:"Destinos",          ayuda:"Dónde podés usar el crédito"},
  reserva:  {titulo:"Cómo reservás",     ayuda:"Cuándo podés elegir la fecha"}
};
const ORDEN_MOSTRAR = ["cubre","garantia","grupo","destinos","reserva"];

/* ---------------------------------------------------------------- estado */
const LS = "encuesta-montana-utdt";
/* El canal de reclutamiento viene en la URL (?c=pauta, ?c=red, ?c=com) y no se le
   pregunta a la persona: preguntarlo da un dato malo, porque nadie se acuerda por dónde
   llegó. Es el dato que sostiene la promesa metodológica de reportar por canal, que es
   la defensa contra el sesgo de autoselección. Si falta, queda "sin_etiqueta" y se
   reporta como tal en lugar de inventarlo. */
function canalDeUrl(){
  try {
    const c = (new URLSearchParams(location.search).get("c") || "").toLowerCase();
    return ["pauta","red","com","piloto"].includes(c) ? c : "sin_etiqueta";
  } catch(e) { return "sin_etiqueta"; }
}

let S = cargar() || {
  id: nuevoId(),
  bloque: Math.floor(Math.random()*DISENO.bloques.length),
  iniciado: new Date().toISOString(),
  canal: canalDeUrl(),
  /* El dispositivo se registra solo, sin preguntar: sirve para leer el abandono, que
     en encuestas largas se concentra en teléfono. */
  pantalla: (typeof screen !== "undefined" ? screen.width + "x" + screen.height : "?"),
  movil: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || ""),
  paso: 0,
  r: {},            // respuestas de las preguntas
  elecciones: [],   // una por tarea
  orden: null,      // orden aleatorio de las tareas
  version: CONFIG.version
};
/* Si alguien retoma con otro link etiquetado, el canal del primer ingreso manda. */
if (!S.canal) { S.canal = canalDeUrl(); guardar(); }

function nuevoId(){
  return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
}
function guardar(){
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){ /* modo privado */ }
}
function cargar(){
  try { const x = localStorage.getItem(LS); return x ? JSON.parse(x) : null; }
  catch(e){ return null; }
}

/* ------------------------------------------------- guardado en el servidor

   Cada paso completado manda un SNAPSHOT del estado entero, no un fragmento.
   Dos razones, y las dos importan:

   · Si alguien abandona a mitad de camino, la respuesta parcial ya está guardada
     y se sabe en qué paso se fue. El abandono en encuestas largas no es aleatorio
     (deserta más el menos interesado), así que medirlo es parte del dato.
   · Como cada envío es autosuficiente, un envío que falla no pierde nada: el
     siguiente lleva todo de nuevo. No hace falta reintentar lo viejo.

   La tabla es append-only con un índice único por (respuesta, paso): reenviar el
   mismo paso no duplica, devuelve conflicto y se ignora. Nunca bloquea a la persona:
   si no hay red, la encuesta sigue y al final queda la vía de copiar y pegar.
*/
let ultimoPasoEnviado = -1;

async function sincronizar(completo){
  if (!CONFIG.endpoint) return false;
  if (!completo && S.paso <= ultimoPasoEnviado) return true;   // ya lo mandé
  const fila = {
    respuesta_id: S.id,
    paso: S.paso,
    completo: !!completo,
    bloque: S.bloque,
    version: CONFIG.version,
    payload: S
  };
  try {
    const res = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: {
        "apikey": CONFIG.apikey,
        "Content-Type": "application/json",
        /* Solo return=minimal. NO usar resolution=ignore-duplicates: PostgREST lo
           implementa como upsert y eso necesita permiso de UPDATE, que esta clave no
           tiene a propósito. El reenvío del mismo paso devuelve 409 por el índice
           único y acá abajo se trata como éxito, que es lo que es. */
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(fila),
      keepalive: true        // que el envío sobreviva si la pestaña se cierra
    });
    if (res.ok || res.status === 409) { ultimoPasoEnviado = S.paso; return true; }
    return false;
  } catch(e) { return false; }
}

/* Si la persona cierra la pestaña a mitad de camino, intentar un último guardado.
   `keepalive` permite que el pedido salga aunque la página se esté yendo. */
window.addEventListener("pagehide", () => {
  if (S.r.consentimiento && !S.terminado) sincronizar(false);
});

/* el orden de las tareas se fija una vez por persona */
function ordenTareas(){
  if (S.orden) return S.orden;
  const n = DISENO.bloques[S.bloque].length;
  const idx = [...Array(n).keys()];
  for (let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  // las fijas van intercaladas: una al principio del tramo, una al final, y la repetida al cierre
  S.orden = {estimacion: idx, fijas:[0,1,0]};
  guardar();
  return S.orden;
}

function semillaDeId(){
  /* Hash del id del respondente, para que la permutación de pantalla varíe ENTRE personas
     y no solo entre pantallas. 🔴 Antes la semilla era (i+1)*constante, o sea que todos
     veían la misma permutación en la pantalla 3. En las diez tareas de estimación se
     salvaba de rebote porque el orden de tareas cambia, pero las TRES FIJAS están clavadas
     en las pantallas 0, 6 y 12: la posición quedaba confundida con el perfil para los 150
     respondentes, y justamente esas tres son las que miden el acierto del modelo. */
  let h = 2166136261;
  for (const ch of String(S.id)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return Math.abs(h) || 1;
}

/* Generador pseudoaleatorio decente, con semilla reproducible.
   🔴 Antes acá había un congruencial lineal casero con `x % (k+1)`, y sobre tres elementos
   producía SOLO 3 de las 6 permutaciones posibles: el primer perfil no caía nunca en la
   posición A. Verificado sobre 3.000 identificadores. Eso reintroducía justo el sesgo de
   posición que la función existe para evitar. Mulberry32 pasa las pruebas de uniformidad
   y no cuesta nada. */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mezclar(arr, semilla){
  const a = arr.slice();
  const rnd = mulberry32(semilla);
  rnd(); rnd();                        // descartar los dos primeros, que correlacionan con la semilla
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(rnd() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

function posiciones(i, n){
  return mezclar([...Array(n).keys()], (semillaDeId() ^ Math.imul(i + 1, 2654435761)) | 0);
}

/* El orden de los atributos dentro de la tarjeta se mezcla UNA VEZ por respondente y se
   guarda: el primer atributo de una tarjeta pesa más que el último, así que dejarlo fijo
   para todos le regala importancia al mismo atributo en los 150 casos. La cuota va siempre
   primera y aparte, porque es el ancla de precio. */
function ordenAtributos(){
  if (S.ordenAtr) return S.ordenAtr;
  S.ordenAtr = mezclar(ORDEN_MOSTRAR, semillaDeId());
  guardar();
  return S.ordenAtr;
}

     "Cuota en dólares"])}
  <div class="err" id="e-mec" hidden>Falta la primera.</div>
  <div class="botones">
    <button class="sec" onclick="anterior()">Volver</button>
    <button onclick="siguiente()">Seguir</button>
  </div>
`, () => req("mecanismo","e-mec"));

/* ---- perfil, al final a propósito */
P(() => `
  <h2>Para cerrar: sobre vos</h2>
  <p class="chico">Estas preguntas sirven para comparar la muestra con las estadísticas oficiales
  de turismo. Ninguna te identifica.</p>
  ${radio("region","¿Dónde vivís?",
    ["Ciudad de Buenos Aires","Provincia de Buenos Aires, Gran Buenos Aires",
     "Provincia de Buenos Aires, resto","Córdoba","Santa Fe","Mendoza","Neuquén o Río Negro",
     "Resto del país","Fuera de la Argentina"])}
  ${radio("edad","¿Qué edad tenés?",
    ["Menos de 25","25 a 34","35 a 44","45 a 54","55 a 64","65 o más"])}
  ${radio("genero","¿Con qué género te identificás?",
    ["Mujer","Varón","Otro","Prefiero no contestar"])}
  ${radio("educacion","¿Cuál es el nivel de estudios más alto que completaste?",
    ["Secundario o menos","Terciario o técnico","Universitario","Posgrado",
     "Prefiero no contestar"])}
  ${radio("ingreso_hogar","Sumando todo lo que entra por mes en tu casa, de todas las personas que aportan y después de descuentos, ¿en qué tramo cae?",
    ["Hasta $800.000","Más de $800.000 y hasta $1.500.000",
     "Más de $1.500.000 y hasta $2.500.000","Más de $2.500.000 y hasta $4.000.000",
     "Más de $4.000.000 y hasta $6.000.000","Más de $6.000.000 y hasta $9.000.000",
     "Más de $9.000.000","Prefiero no contestar"])}
  ${num("personas_hogar","¿Cuántas personas viven en tu casa, contándote a vos y a los chicos?",1,15)}
  ${radio("fin_de_mes","Pensando en todo lo que entra en tu casa, ¿cómo llegan a fin de mes?",
    ["No alcanza y hay que pedir prestado","Justo, sin margen para ahorrar",
     "Alcanza y queda algo","Alcanza bien y se puede ahorrar o invertir",
     "Prefiero no contestar"])}
  ${radio("cuota_otra","¿Pagás hoy alguna cuota mensual por deporte u ocio? (gimnasio, club, coach, alguna app)",
    ["Sí, una","Sí, dos o más","No","No ahora, pero pagué antes"])}
  ${S.canal === "sin_etiqueta" ? radio("como_llego","¿Por dónde llegaste a esta encuesta?",
    ["Un aviso en Instagram o Facebook","Me la mandó alguien que conozco",
     "Un grupo o comunidad de montaña","Otro lugar"]) : ''}
  <div class="err" id="e-perf" hidden>Faltan región y edad.</div>
  <div class="botones">
    <button class="sec" onclick="anterior()">Volver</button>
    <button onclick="enviar()">Enviar respuestas</button>
  </div>
`, () => {
  const ok = S.r.region !== undefined && S.r.edad !== undefined;
  document.getElementById("e-perf").hidden = ok;
  return ok;
});

/* ---------------------------------------------------- helpers de widgets */
function radio(campo, texto, ops){
  let h = texto ? `<p><b>${texto}</b></p>` : "";
  ops.forEach(o => {
    const sel = S.r[campo] === o ? " sel" : "";
    h += `<label class="opcion${sel}"><input type="radio" name="${campo}"
      ${S.r[campo]===o?"checked":""} onchange="setR('${campo}', this.dataset.v)"
      data-v="${esc(o)}"><span>${o}</span></label>`;
  });
  return h;
}
function radioEl(i, campo, texto, ops){
  let h = texto ? `<p><b>${texto}</b></p>` : "";
  const e = S.elecciones[i] || {};
  ops.forEach(o => {
    const sel = e[campo] === o ? " sel" : "";
    h += `<label class="opcion${sel}"><input type="radio" name="${campo}-${i}"
      ${e[campo]===o?"checked":""} onchange="setEl(${i},'${campo}', this.dataset.v)"
      data-v="${esc(o)}"><span>${o}</span></label>`;
  });
  return h;
}
function check(campo, texto, ops){
  let h = `<p><b>${texto}</b></p>`;
  const act = S.r[campo] || [];
  ops.forEach(o => {
    const sel = act.includes(o) ? " sel" : "";
    h += `<label class="opcion${sel}"><input type="checkbox"
      ${act.includes(o)?"checked":""} onchange="togR('${campo}', this.dataset.v)"
      data-v="${esc(o)}"><span>${o}</span></label>`;
  });
  return h;
}
/* Campo numérico que acepta cómo la gente escribe de verdad.
   🔴 Antes era <input type="number">, y ahí "1.200.000" tecleado con puntos devuelve
   value = "": la persona veía su número en la caja y el dato no se guardaba en ningún
   lado. Pasa justo en las preguntas de plata, que son las más caras de volver a pedir.
   Ahora es text, se limpian los separadores, y debajo se muestra lo que QUEDÓ guardado,
   que es la única forma de que un recorte por tope no sea invisible. */
function num(campo, texto, min, max){
  const g = S.r[campo];
  const v = g !== undefined ? g : "";
  const plata = max > 10000;
  const eco = g !== undefined
    ? `<div class="chico" style="margin-top:3px">Guardado: <b>${plata ? "$" : ""}${g.toLocaleString("es-AR")}</b></div>`
    : "";
  return `<label><b>${texto}</b>
    <input type="text" inputmode="numeric" autocomplete="off" value="${v}"
      oninput="setNum('${campo}', this.value, ${min}, ${max})">${eco}</label>`;
}
function escala(campo, texto, izq, der){
  let h = `<p><b>${texto}</b></p><div class="escala">`;
  for (let i=1;i<=10;i++){
    h += `<button class="${S.r[campo]===i?"sel":""}" onclick="setR('${campo}',${i})">${i}</button>`;
  }
  h += `</div><div class="chico" style="display:flex;justify-content:space-between">
    <span>${izq}</span><span>${der}</span></div>`;
  return h;
}
function esc(s){ return String(s).replace(/"/g,"&quot;"); }
window.setR = (c,v) => { S.r[c] = v; guardar(); pintar(); };
window.togR = (c,v) => {
  const a = S.r[c] || [];
  if (a.includes(v)) { S.r[c] = a.filter(x=>x!==v); }
  else {
    /* Tope de dos en la pregunta de los meses sin viaje: forzar la prioridad da más
       información que dejar marcar todo, que es lo mismo que no preguntar. */
    const tope = (c === "sin_viaje") ? 2 : 99;
    S.r[c] = a.length >= tope ? a.slice(1).concat([v]) : a.concat([v]);
  }
  guardar(); pintar();
};
window.setNum = (c,v,min,max) => {
  /* Se limpian puntos, comas, espacios y el signo de pesos: "$ 1.200.000" -> 1200000.
     Sin esto, escribir un monto con separadores de miles no guardaba nada. */
  const limpio = String(v).replace(/[^0-9]/g, "");
  if (limpio === "") { delete S.r[c]; guardar(); pintar(); return; }
  let n = Number(limpio);
  if (!Number.isFinite(n)) return;
  n = Math.max(min, Math.min(max, n));
  const cambio = S.r[c] !== n;
  S.r[c] = n;
  /* Si bajan las contratadas por debajo de las canceladas, se recorta en el acto: dejarlo
     inconsistente hasta apretar "Seguir" muestra un error que el usuario no entiende. */
  if (c === "contrato_2a" && S.r.cancelo_2a > n) { S.r.cancelo_2a = n; guardar(); pintar(); return; }
  guardar();
  /* El tope del campo de canceladas depende de las contratadas, y está embebido en el HTML:
     sin repintar, el input se queda con el tope viejo y acepta un valor que después rebota. */
  if (c === "contrato_2a" && cambio) { pintar(); return; }
  /* Repintar solo cuando el valor guardado difiere de lo tecleado (un recorte por tope),
     para que el eco de abajo no mienta. Repintar siempre movería el cursor en cada letra. */
  if (cambio && String(n) !== limpio) pintar();
  else if (cambio) {
    const lab = document.activeElement && document.activeElement.closest("label");
    if (lab) {
      const eco = lab.querySelector(".chico");
      const plata = max > 10000;
      if (eco) eco.innerHTML = 'Guardado: <b>' + (plata ? "$" : "") + n.toLocaleString("es-AR") + '</b>';
      else lab.insertAdjacentHTML("beforeend",
        '<div class="chico" style="margin-top:3px">Guardado: <b>' +
        (plata ? "$" : "") + n.toLocaleString("es-AR") + '</b></div>');
    }
  }
};
function req(campo, errId){
  const ok = S.r[campo] !== undefined;
  const e = document.getElementById(errId);
  if (e) e.hidden = ok;
  return ok;
}

/* ---------------------------------------------------- navegación */
function pasosVisibles(){
  return PASOS.map((p,i) => ({p,i})).filter(x => x.p.render() !== null);
}
window.siguiente = () => {
  const act = PASOS[S.paso];
  if (act.valida && !act.valida()) return;
  let n = S.paso + 1;
  while (n < PASOS.length && PASOS[n].render() === null) n++;
  if (n >= PASOS.length) return;
  S.paso = n; guardar(); pintar(); window.scrollTo(0,0);
  /* Se guarda en el servidor después de avanzar, sin await: la persona no espera
     por la red. Solo a partir del consentimiento, nunca antes. */
  if (S.r.consentimiento) sincronizar(false);
};
window.anterior = () => {
  let n = S.paso - 1;
  while (n > 0 && PASOS[n].render() === null) n--;
  S.paso = Math.max(0, n); guardar(); pintar(); window.scrollTo(0,0);
};

function pintar(){
  const html = PASOS[S.paso].render();
  app.innerHTML = html === null ? "" : html;
  const vis = pasosVisibles();
  const pos = vis.findIndex(x => x.i === S.paso);
  const prog = document.getElementById("progreso");
  if (S.paso > 0 && pos >= 0) {
    prog.hidden = false;
    document.getElementById("barra").style.width = Math.round(100*(pos)/(vis.length-1)) + "%";
    document.getElementById("paso-txt").textContent =
      "Paso " + (pos+1) + " de " + vis.length;
  } else { prog.hidden = true; }
}

/* ---------------------------------------------------- envío */
window.enviar = async () => {
  const act = PASOS[S.paso];
  if (act.valida && !act.valida()) return;
  S.terminado = new Date().toISOString();
  S.bloque_id = S.bloque;
  S.diseno_derror = DISENO.derror;
  guardar();

  const payload = JSON.stringify(S);
  app.innerHTML = `<h2>Enviando…</h2><p class="chico">Un segundo.</p>`;

  /* Dos intentos con una espera en el medio: la mayoría de los fallos de red son
     momentáneos, y acá la respuesta ya está completa y sería una pena perderla. */
  let ok = await sincronizar(true);
  if (!ok) {
    await new Promise(r => setTimeout(r, 1500));
    ok = await sincronizar(true);
  }

  if (ok) {
    try { localStorage.removeItem(LS); } catch(e){}
    app.innerHTML = `<h1>Listo, gracias</h1>
      <p>Tu respuesta quedó registrada. Gracias por tomarte el tiempo de responder y llegar
      hasta el final.</p>`;
  } else {
    /* La via de respaldo existe porque una respuesta completa que se pierde por un error de
       red es una respuesta que hay que volver a conseguir. */
    app.innerHTML = `<h1>Casi listo</h1>
      <div class="aviso"><b>Terminaste, pero no pude confirmar el último envío.</b> Lo más
      probable es que haya quedado guardado igual, porque la encuesta va guardando a medida que
      avanzás. Si querés asegurarte, probá el botón de reintentar.</div>
      <div class="botones">
        <button onclick="reintentar()">Reintentar el envío</button>
        <button class="sec" onclick="verVolcado()">Copiar la respuesta a mano</button>
      </div>
      <div id="respaldo" hidden>
        <p class="chico">Copiá este texto y mandámelo por donde me escribiste.</p>
        <button onclick="copiar()">Copiar el texto</button>
        <code class="codigo" id="volcado">${esc(payload)}</code>
      </div>`;
  }
  document.getElementById("progreso").hidden = true;
};
/* Dos personas que responden en el mismo teléfono (una charla, una reunión) compartirían
   el estado guardado: la segunda seguiría la encuesta de la primera. Esto le da salida. */
/* Se pregunta antes de borrar: un toque accidental en «¿No sos vos?» a mitad del
   experimento tiraría abajo doce minutos de respuestas. */
window.confirmarReinicio = (ev) => {
  if (ev) ev.preventDefault();
  if (confirm("Esto borra lo que está respondido en este dispositivo y empieza una encuesta nueva. ¿Seguimos?")) {
    empezarDeNuevo();
  }
};

window.empezarDeNuevo = () => {
  try { localStorage.removeItem(LS); } catch(e){}
  S = { id: nuevoId(), bloque: Math.floor(Math.random()*DISENO.bloques.length),
        iniciado: new Date().toISOString(), canal: canalDeUrl(),
        pantalla: (typeof screen !== "undefined" ? screen.width + "x" + screen.height : "?"),
        movil: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || ""),
        paso: 0, r: {}, elecciones: [], orden: null, ordenAtr: null,
        version: CONFIG.version };
  ultimoPasoEnviado = -1;
  guardar(); pintar(); window.scrollTo(0,0);
};

window.verVolcado = () => { document.getElementById("respaldo").hidden = false; };
window.reintentar = async () => {
  app.innerHTML = `<h2>Reintentando…</h2>`;
  ultimoPasoEnviado = -1;
  const ok = await sincronizar(true);
  if (ok) {
    try { localStorage.removeItem(LS); } catch(e){}
    app.innerHTML = `<h1>Listo, gracias</h1><p>Ahora sí quedó registrada.</p>`;
  } else {
    app.innerHTML = `<h1>Sigue sin conectar</h1>
      <div class="aviso">Copiá el texto de abajo y mandámelo, así no se pierde.</div>
      <button onclick="copiar()">Copiar el texto</button>
      <code class="codigo" id="volcado">${esc(JSON.stringify(S))}</code>`;
  }
};
window.copiar = () => {
  const t = document.getElementById("volcado").textContent;
  navigator.clipboard?.writeText(t).then(
    () => alert("Copiado. Mandámelo por WhatsApp o correo, gracias."),
    () => alert("No pude copiar. Seleccioná el texto a mano, por favor.")
  );
};

pintar();
</script>

</html>
